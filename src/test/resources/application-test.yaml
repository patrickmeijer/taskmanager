spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
app:
  jwt:
    secret: test-secret-key-only-for-integration-tests-not-for-production
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000